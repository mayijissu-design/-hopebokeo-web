    <!-- Dark mode persistence & harmless notification filter script -->
    <script>
      (function() {
        // Prevent harmless ResizeObserver notification loops from throwing unhandled errors
        window.addEventListener('error', function(e) {
          if (e && e.message && (
            e.message.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1 ||
            e.message.indexOf('ResizeObserver loop limit exceeded') !== -1
          )) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return false;
          }
        });

        try {
          var saved = localStorage.getItem('hb_dark_mode');
          if (saved === 'true' || (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            if (document.body) document.body.classList.add('dark');
          }
        } catch (e) {}

        // Remove any bloated cache item (>1MB) to prevent synchronous main-thread allocation spikes
        try {
          ['hb_cached_villages', 'hb_cached_events', 'hb_cached_teams', 'hb_cached_home_poster'].forEach(function(k) {
            var raw = localStorage.getItem(k);
            if (raw && raw.length > 1048576) {
              localStorage.removeItem(k);
            }
          });
        } catch (e) {}
      })();
    </script>
